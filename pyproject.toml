[build-system]
requires = ["setuptools==78.1.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "eventsourcing-helpers"
version = "2.4.1"
description = "Helpers for practicing the Event sourcing pattern"
requires-python = ">=3.11"
authors = [{name = "Fyndiq AB", email = "support@fyndiq.com"}]
license = {text = "MIT"}
dependencies = [
    "structlog>=17.2.0",
    "jsonpickle>=0.9.6",
    "confluent-kafka-helpers>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/fyndiq/eventsourcing_helpers"

[project.optional-dependencies]
mongo = ["pymongo>=3.6.1"]
redis = ["redis>=2.10.6", "hiredis>=0.2.0"]
cnamedtuple = ["cnamedtuple>=0.1.6"]
pydantic = ["pydantic>=2"]

[project.entry-points.pytest11]
eventsourcing_helpers = "eventsourcing_helpers.messagebus.backends.mock.test"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
include = ["eventsourcing_helpers*", "tests*"]
namespaces = false

[dependency-groups]
dev = [
    "black==24.10.0",
    "commitizen==4.13.9",
    "fakeredis==2.26.2",
    # pdbpp 0.10.3 needs the LazyVersion API from this release.
    "fancycompleter==0.9.1",
    "flake8==7.1.1",
    "flake8-black==0.3.6",
    "flake8-eradicate==1.5.0",
    "flake8-isort==6.1.1",
    "ipdb==0.13.13",
    "isort==5.13.2",
    "mongomock==4.3.0",
    "mypy==1.14.1",
    "pdbpp==0.10.3",
    "pytest==8.3.4",
    "pytest-coverage==0.0",
    "pytest-mock==3.14.0",
    "pytest-sugar==1.0.0",
    "types-redis==4.6.0.20241004",
    "yapf==0.43.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = false
changelog_merge_prerelease = true
annotated_tag = true

[[tool.uv.index]]
name = "qlty"
url = "https://oauth2accesstoken@europe-north1-python.pkg.dev/fyndiq/qlty/simple/"
publish-url = "https://europe-north1-python.pkg.dev/fyndiq/qlty/"
explicit = true
exclude-newer = false

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_test = "tests"
known_libs = "confluent_kafka_helpers"
sections = ["FUTURE","STDLIB","THIRDPARTY","FIRSTPARTY","LIBS","LOCALFOLDER","TEST"]
skip_gitignore = true
